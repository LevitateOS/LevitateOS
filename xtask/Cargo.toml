[package]
name = "levitate-xtask"
version = "0.1.0"
# xtask alone is written for edition 2024; it inherits the rest of the workspace metadata.
edition = "2024"
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
tempfile = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
distro-contract = { path = "../distro/contract" }
distro-builder = { path = "../distro/builder" }
install-split-pane = { path = "../distro/builder/install-split-pane" }
recinit = { path = "../tools/recinit" }
which = { workspace = true }
regex = "1"
quick-xml = "0.37"
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }
vt100 = { workspace = true }
install-tests = { path = "../testing/install-tests" }
portable-pty = { workspace = true }
recpart = { path = "../tools/recpart", features = ["contracts"] }
recab = { path = "../tools/recab", features = ["contracts"] }
recstrap = { path = "../tools/recstrap", features = ["contracts"] }
recqemu = { path = "../tools/recqemu" }
schemars = { workspace = true }
ts-rs = { workspace = true }
