[package]
name = "levitate-xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tempfile = "3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
distro-contract = { path = "../distro/contract" }
distro-builder = { path = "../distro/builder" }
install-split-pane = { path = "../distro/builder/install-split-pane" }
recinit = { path = "../tools/recinit" }
which = "7"
regex = "1"
quick-xml = "0.37"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
vt100 = "0.15"
install-tests = { path = "../testing/install-tests" }
portable-pty = "0.8"
recpart = { path = "../tools/recpart", features = ["contracts"] }
recab = { path = "../tools/recab", features = ["contracts"] }
recshuttle = { path = "../tools/recshuttle" }
recqemu = { path = "../tools/recqemu" }
schemars = "1"
ts-rs = "12"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
