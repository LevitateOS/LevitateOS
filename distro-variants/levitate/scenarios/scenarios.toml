schema_version = 6

[scenarios.live_boot]
# The serial test protocol's readiness marker always means success; the
# rootfs-missing message of the live init (live_boot::ROOTFS_MISSING_MESSAGE)
# is always fatal.
success_patterns = []
fatal_patterns = [
  "No bootable device",
  "Boot Failed",
  "Default Boot Device Missing",
  "Shell>",
  "ASSERT_EFI_ERROR",
  "map: Cannot find",
  "systemd-boot: Failed",
  "loader: Failed",
  "vmlinuz: not found",
  "initramfs: not found",
  "Error loading",
  "File not found",
  "Kernel panic",
  "not syncing",
  "VFS: Cannot open root device",
  "No init found",
  "Attempted to kill init",
  "can't find /init",
  "No root device",
  "EROFS:",
  "SQUASHFS error",
  "emergency shell",
  "Emergency shell",
  "emergency.target",
  "rescue.target",
  "Timed out waiting for device",
  "fatal error",
  "Segmentation fault",
  "core dumped",
]
required_kernel_cmdline = [
  "console=ttyS0,115200n8",
  "console=tty0",
  "selinux=0",
  "audit=1",
  "audit_backlog_limit=8192",
  "loglevel=3",
  "systemd.show_status=0",
  "rd.systemd.show_status=0",
]
required_live_services = ["sshd"]

[scenarios.live_boot.evidence]
script_path = "live-boot.sh"
pass_marker = "LIVE BOOT PASSED"

[scenarios.live_environment]
required_services = ["sshd", "auditd"]

[scenarios.live_tools]
serial_ready_patterns = [" login:"]
required_tools = [
  "recpart",
  "recstrap",
  "recfstab",
  "recchroot",
  "sfdisk",
  "mkfs.ext4",
  "ip",
  "ping",
  "curl",
  "lspci",
  "lsusb",
  "vi",
  "less",
  "grep",
  "find",
]
install_experience = "ux"

[scenarios.live_tools.evidence]
script_path = "live-tools.sh"
pass_marker = "LIVE TOOLS PASSED"

[scenarios.install]
required_tools = ["recpart", "recstrap", "recfstab", "recchroot", "sfdisk", "mkfs.ext4"]
required_services = ["sshd", "auditd"]

[scenarios.install.evidence]
script_path = "install.sh"
pass_marker = "INSTALL PASSED"

[scenarios.installed_boot]
success_patterns = ["levitateos login:", "multi-user.target"]
fatal_patterns = [
  "No bootable device",
  "Boot Failed",
  "Default Boot Device Missing",
  "Shell>",
  "ASSERT_EFI_ERROR",
  "map: Cannot find",
  "systemd-boot: Failed",
  "loader: Failed",
  "vmlinuz: not found",
  "initramfs: not found",
  "Error loading",
  "File not found",
  "Kernel panic",
  "not syncing",
  "VFS: Cannot open root device",
  "No init found",
  "Attempted to kill init",
  "can't find /init",
  "No root device",
  "EROFS:",
  "SQUASHFS error",
  "emergency shell",
  "Emergency shell",
  "emergency.target",
  "rescue.target",
  "Timed out waiting for device",
  "fatal error",
  "Segmentation fault",
  "core dumped",
]
service_failure_patterns = ["Failed to start", "[FAILED]", "Dependency failed"]
required_kernel_cmdline = []
required_live_services = []

[scenarios.installed_boot.evidence]
script_path = "installed-boot.sh"
pass_marker = "INSTALLED BOOT PASSED"

[scenarios.automated_login]
auth_mode = "default_password_login"
default_username = "levitate"
default_password = "levitate"
login_prompt_pattern = "levitateos login:"

[scenarios.automated_login.evidence]
script_path = "automated-login.sh"
pass_marker = "AUTOMATED LOGIN PASSED"

[scenarios.installed_tools]
required_tools = ["sudo", "ip", "ssh", "bash", "mount", "umount", "dmesg", "ps", "ls", "cat"]

[scenarios.installed_tools.evidence]
script_path = "installed-tools.sh"
pass_marker = "INSTALLED TOOLS PASSED"

[scenarios.runtime_policy]
rootfs_mutability = "mutable"
mutable_required_rw_paths = []
immutable_required_ro_paths = []
