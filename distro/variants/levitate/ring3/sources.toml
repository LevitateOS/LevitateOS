schema_version = 6

[ring3_sources.rootfs_source]
memory_mib = 8192
preseed_memory_mib = 8192
network_hosts = []
preseed_network_hosts = ["dl.fedoraproject.org:443"]
kind = "recipe_rpm_set"
recipe_script = "distro/builder/recipes/fedora-rpm-source-rootfs.rhai"
preseed_recipe_script = "distro/builder/recipes/fedora-rpm-preseed.rhai"
preseed_outputs = { rpms = "directory" }

# What the rootfs takes from Fedora. `cargo xtask base lock levitate` resolves
# the newest signed build of each from the release and updates repositories
# into distro/builder/recipes/sources/levitate-rpm-lock.rhai.
[ring3_sources.rootfs_source.rpm_base]
fedora_release = 45
signing_key = "ring3/keys/RPM-GPG-KEY-fedora-45-primary"
packages = [
  # Root filesystem skeleton and core runtime.
  "filesystem",
  "setup",
  "bash",
  "bash-completion",
  "coreutils",
  "coreutils-common",
  "findutils",
  "grep",
  "gawk",
  "ncurses-libs",
  "sed",
  "diffutils",
  # System boot/service runtime for live boot.
  "systemd",
  "systemd-libs",
  "systemd-udev",
  "iproute",
  "kmod",
  "util-linux",
  "util-linux-core",
  # Installing to disk and A/B updates: recpart formats ext4 and FAT, recab
  # stage formats a slot, and bootctl install copies systemd-boot's EFI binary.
  "e2fsprogs",
  "e2fsprogs-libs",
  "libss",
  "dosfstools",
  "systemd-boot-unsigned",
  "iputils",
  "curl",
  "libcurl",
  "libidn2",
  "libunistring",
  "libnghttp2",
  "libssh",
  "libpsl",
  "openldap",
  "libbrotli",
  "libevent",
  "cyrus-sasl-lib",
  "pciutils",
  "pciutils-libs",
  "usbutils",
  "libusb1",
  "less",
  "libfdisk",
  "readline",
  "kmod-libs",
  "libmount",
  "libblkid",
  "libsmartcols",
  "libuuid",
  "shadow-utils",
  "sudo",
  # SSH + service wiring expectations.
  "openssh-server",
  "openssh",
  "openssh-clients",
  # RPM dependency solving is not active in this extraction path; include
  # OpenSSH Kerberos runtime libs explicitly for sshd-session.
  "krb5-libs",
  "keyutils-libs",
  "libverto",
  "libcom_err",
  "dbus",
  "dbus-common",
  "dbus-daemon",
  "dbus-broker",
  "expat",
  # Locale + console essentials.
  "glibc",
  "glibc-common",
  "glibc-minimal-langpack",
  "kbd",
  "kbd-misc",
  # Common runtime libs used by copied binaries.
  "libgcc",
  "libstdc++",
  "pam",
  "pam-libs",
  "libacl",
  "libattr",
  "libcap-ng",
  "libeconf",
  "libseccomp",
  "pcre2",
  "libxcrypt",
  "libcap",
  "libbpf",
  "elfutils-libelf",
  "libmnl",
  "libzstd",
  "audit-libs",
  "audit",
  "libselinux",
  "openssl-libs",
  "zlib-ng-compat",
  "xz-libs",
  "procps-ng",
  # Shared libraries the packages above link against. The lock takes no RPM
  # dependency solving, so every library a locked binary loads is named here:
  # without them systemctl/bootctl (systemd-shared), useradd (libsemanage) and
  # the rest fail with "error while loading shared libraries".
  "systemd-shared",
  "cryptsetup-libs",
  "device-mapper-libs",
  "json-c",
  "tpm2-tss",
  "libxml2",
  "libsemanage",
  "libsepol",
  "bzip2-libs",
  "liblastlog2",
  "libnsl2",
  "libtirpc",
  "gdbm-libs",
  "dbus-libs",
  "fuse3-libs",
  "gmp",
  "mpfr",
  "libedit",
  "libfido2",
  "libcbor",
  "libnghttp3",
  "ngtcp2",
  "ngtcp2-crypto-ossl",
  "libtool-ltdl",
  "libxkbcommon",
  "sqlite-libs",
]
