# LevitateOS variant contract. Its shape is `distro_contract::ConformanceContract`;
# `distro_contract::load` reads and validates it. Paths are relative to the repo
# root unless a comment says otherwise. The products and scenarios are
# `distro_contract::registry`, the same for every variant, and every artifact
# name (`<os_id>-x86_64-<product>.iso`, `<os_id>-live.efi`, ...) follows from
# `os_id`.
schema_version = 8

[identity]
os_name = "LevitateOS"
os_id = "levitateos"
os_version = "1.0"

# The base facts this variant differs in (`distro_profile::Profile`). The
# builder writes them into the image's /etc/os-release as REC_* fields, which
# the install tools read on the target. The ISO label (`os_id` in capitals),
# default hostname (`os_id`), login prompt (`<os_id> login:`) and kernel
# localversion (`-<variant id>`) follow from the identity, and the bun TUI binary
# is built for the libc. `kernel_line` picks the kernel: its exact version is
# pinned in distro/builder/os-recipes/kernel/metadata.rhai, its configuration is
# ../_shared/kconfig plus `kconfig` beside this file.
[profile]
packages = "rpm"
init = "systemd"
libc = "glibc"
privilege = "sudo"
desktop = "plasma"
kernel_line = "latest"

[sources.rootfs_source]
recipe_script = "distro/builder/os-recipes/fedora-rpm-source-rootfs.rhai"
preseed_recipe_script = "distro/builder/os-recipes/fedora-rpm-preseed.rhai"

# What the rootfs takes from Fedora 45; `cargo xtask base lock levitate` locks
# it with every dependency.
[sources.rootfs_source.base]
release = "45"
signing_key = "keys/RPM-GPG-KEY-fedora-45-primary"
# The image writes its own os-release; `setup` asks for a `system-release`
# package, which would pull fedora-release and its repo files.
provided_elsewhere = ["system-release"]
packages = [
  # Root filesystem skeleton and core runtime.
  "filesystem",
  "setup",
  "bash",
  "bash-completion",
  "coreutils",
  "findutils",
  "grep",
  "gawk",
  "sed",
  "diffutils",
  # System boot/service runtime for live boot.
  "systemd",
  "systemd-udev",
  # Fedora 45 ships systemd-sysusers apart from systemd; without it the system
  # users and groups (systemd-journal, ...) are never made and boots end degraded.
  "systemd-sysusers",
  "iproute",
  "kmod",
  "util-linux",
  "util-linux-core",
  # Disks, filesystems and the boot loader.
  "e2fsprogs",
  "dosfstools",
  "systemd-boot-unsigned",
  "iputils",
  "curl",
  "pciutils",
  "usbutils",
  "less",
  # vi (vim-minimal) and vim.
  "vim-minimal",
  "vim-enhanced",
  "which",
  # Archives and disk/system diagnostics.
  "tar",
  "gzip",
  "htop",
  "smartmontools",
  "hdparm",
  # Time sync.
  "chrony",
  "shadow-utils",
  "sudo",
  # SSH + service wiring expectations.
  "openssh-server",
  "openssh",
  "openssh-clients",
  # The Kerberos libraries sshd-session loads.
  "dbus",
  "dbus-common",
  "dbus-daemon",
  "dbus-broker",
  # Locale + console essentials.
  "glibc",
  "glibc-minimal-langpack",
  "kbd",
  # The console keymaps loadkeys loads.
  # Common runtime libs used by copied binaries.
  "pam",
  "audit",
  "procps-ng",
  # Shared libraries the packages above load. The lock resolves them as
  # dependencies, so naming them is redundant.
  # What the install docs configure: time zones under /usr/share/zoneinfo,
  # compiled English locales, and NetworkManager with its libraries.
  "tzdata",
  "glibc-langpack-cs",
  "glibc-langpack-de",
  "glibc-langpack-en",
  "glibc-langpack-es",
  "glibc-langpack-fi",
  "glibc-langpack-fr",
  "glibc-langpack-it",
  "glibc-langpack-nb",
  "glibc-langpack-nl",
  "glibc-langpack-pt",
  "glibc-langpack-ru",
  "glibc-langpack-sr",
  "glibc-langpack-sv",
  "NetworkManager",
  # WiFi: NetworkManager's wifi plugin over wpa_supplicant, and iw.
  "NetworkManager-wifi",
  "wpa_supplicant",
  "wireless-regdb",
  "iw",
  # Firmware the kernel's drivers load from /usr/lib/firmware (.xz, which the
  # kernel reads through FW_LOADER_COMPRESS_XZ): graphics, WiFi and Bluetooth,
  # laptop audio, and linux-firmware for the rest. No CPU microcode: nothing
  # puts it in front of the initramfs yet.
  "linux-firmware",
  "amd-gpu-firmware",
  "intel-gpu-firmware",
  "nvidia-gpu-firmware",
  "iwlwifi-dvm-firmware",
  "iwlwifi-mvm-firmware",
  "iwlwifi-mld-firmware",
  "iwlbluetooth-firmware",
  "realtek-firmware",
  "mt7xxx-firmware",
  "atheros-firmware",
  "brcmfmac-firmware",
  "alsa-sof-firmware",
  "intel-audio-firmware",
  "cirrus-audio-firmware",
]

# The desktop system, the rootfs of the live-desktop product (docs/desktop.md):
# the base packages plus these, KDE Plasma on Wayland with SDDM. systemd-pam is
# required: without pam_systemd.so logind registers no session and Wayland gets
# no seat. `cargo xtask base lock levitate` locks what they need beyond the base
# lock; the preseed downloads that desktop lock.
[desktop]
display_manager = "sddm"
preseed_recipe_script = "distro/builder/os-recipes/fedora-rpm-desktop-preseed.rhai"
packages = [
  "plasma-desktop", "plasma-workspace", "kwin", "sddm", "sddm-breeze", "sddm-wayland-plasma",
  "xorg-x11-server-Xwayland", "konsole", "dolphin", "kwrite", "ark", "spectacle",
  "plasma-systemmonitor", "plasma-nm", "plasma-pa", "powerdevil", "kscreen", "kinfocenter",
  "kde-gtk-config", "breeze-gtk", "breeze-icon-theme", "xdg-desktop-portal-kde", "polkit-kde",
  "kwalletmanager5", "pipewire", "pipewire-pulseaudio", "pipewire-alsa", "wireplumber",
  "mesa-dri-drivers", "mesa-vulkan-drivers", "google-noto-sans-fonts",
  "google-noto-sans-mono-fonts", "google-noto-color-emoji-fonts", "NetworkManager-wifi",
  "wpa_supplicant", "firefox", "systemd-pam",
  # Battery state and power profiles, mounting removable drives, and the
  # wallet unlocked at login (pam_kwallet5, which Fedora's SDDM PAM file loads).
  "upower", "power-profiles-daemon", "udisks2", "pam-kwallet",
  # Bluetooth, printing (CUPS with driverless network and IPP-over-USB
  # printers, found through Avahi), Intel video decoding (Mesa's VA drivers
  # are in mesa-dri-drivers), Thunderbolt, exFAT and NTFS
  # drives, OpenVPN, and the guest agents of the libvirt test VMs.
  "bluez", "bluedevil", "cups", "cups-filters", "ipp-usb", "avahi", "plasma-print-manager",
  "libva-intel-media-driver", "bolt", "plasma-thunderbolt", "exfatprogs", "ntfs-3g",
  "NetworkManager-openvpn", "plasma-nm-openvpn", "spice-vdagent", "qemu-guest-agent",
  # Fonts for documents and CJK text, file thumbnails, manual pages, the
  # screen reader.
  "google-noto-serif-fonts", "google-noto-sans-cjk-fonts", "liberation-sans-fonts",
  "liberation-serif-fonts", "liberation-mono-fonts", "kdegraphics-thumbnailers", "ffmpegthumbs",
  "man-db", "orca",
  # Orca's speech (the solver takes no weak dependencies, so the voice is
  # named), a calculator, KDE's crash handler, scanning, and the firewall
  # with Plasma's settings page for it.
  "speech-dispatcher", "speech-dispatcher-espeak-ng", "espeak-ng", "kcalc", "plasma-drkonqi",
  "sane-backends", "sane-backends-drivers-scanners", "skanlite", "firewalld", "plasma-firewall",
  "plasma-firewall-firewalld",
]
