# LevitateOS variant contract. Its shape is `distro_contract::ConformanceContract`;
# `distro_contract::load` reads and validates it. Paths are relative to the repo
# root unless a comment says otherwise. The products and scenarios are
# `distro_contract::registry`, the same for every variant, and every artifact
# name (`<os_id>-x86_64-<product>.iso`, `<os_id>-live.efi`, ...) follows from
# `os_id`.
schema_version = 13

[identity]
os_name = "LevitateOS"
os_id = "levitateos"
os_version = "1.0"
# The release serial: raise it by one, by hand, for every release (installed
# systems compare serials, never os_version), and point release_notes at that
# release's notes. docs/release-engineering.md, section 2.
release_serial = 1
release_notes = "https://levitateos.org/releases/levitateos/1.0"
home_url = "https://levitateos.org"

# The base facts this variant differs in (`distro_profile::Profile`). The
# builder writes them into the image's /etc/os-release as REC_* fields, which
# the install tools read on the target. The ISO label (`os_id` in capitals),
# default hostname (`os_id`), login prompt (`<os_id> login:`) and kernel
# localversion (`-<variant id>`) follow from the identity, and the bun TUI binary
# is built for the libc. `appearance` is the mode the distro starts in.
# `kernel_line` picks the kernel: its exact version is pinned in
# distro/builder/os-recipes/kernel/metadata.rhai, its configuration is
# ../_shared/kconfig plus `kconfig` beside this file.
[profile]
packages = "rpm"
init = "systemd"
libc = "glibc"
privilege = "sudo"
desktop = "plasma"
kernel_line = "latest"
appearance = "dark"

# The mode the distro starts in is `profile.appearance`; these are its colours in
# each mode. The terminal apps, the desktop look and the website all take them
# from here.
[look.light]
surface = "#DDE2D2"
surface_raised = "#E8ECDF"
surface_sunken = "#CFD6C3"
text = "#14221A"
text_secondary = "#465047"
text_muted = "#5C6459"
rule = "#AEB8A4"
hairline = "#C6CDB9"
accent = "#214438"
highlight = "#644532"
band = "#214438"
on_band = "#F2EEE4"
ok = "#2F6B3F"
warn = "#7F5200"
bad = "#B22F27"

[look.dark]
surface = "#14221A"
surface_raised = "#1D2D24"
surface_sunken = "#0D1711"
text = "#F2EEE4"
text_secondary = "#BAC5B7"
text_muted = "#9AA89D"
rule = "#3A4B40"
hairline = "#2A3B31"
accent = "#C7D9BA"
highlight = "#E4CBA6"
band = "#214438"
on_band = "#F2EEE4"
ok = "#A9CF9A"
warn = "#F0B866"
bad = "#F0A497"

[sources.rootfs_source]
recipe_script = "distro/builder/os-recipes/fedora-rpm-source-rootfs.rhai"
preseed_recipe_script = "distro/builder/os-recipes/fedora-rpm-preseed.rhai"

# What the rootfs takes from Fedora 45; `cargo xtask base lock levitate` locks
# it with every dependency.
[sources.rootfs_source.base]
release = "45"
signing_key = "keys/RPM-GPG-KEY-fedora-45-primary"
# The image writes its own os-release; `setup` asks for a `system-release`
# package, which would pull fedora-release and its repo files.
provided_elsewhere = ["system-release"]
packages = [
  # Root filesystem skeleton and core runtime.
  "filesystem",
  "setup",
  "bash",
  "bash-completion",
  "coreutils",
  "findutils",
  "grep",
  "gawk",
  "sed",
  "diffutils",
  # System boot/service runtime for live boot.
  "systemd",
  "systemd-udev",
  # Fedora 45 ships systemd-sysusers apart from systemd; without it the system
  # users and groups (systemd-journal, ...) are never made and boots end degraded.
  "systemd-sysusers",
  "iproute",
  "kmod",
  "util-linux",
  "util-linux-core",
  # Disks, filesystems and the boot loader.
  "e2fsprogs",
  "dosfstools",
  "systemd-boot-unsigned",
  "iputils",
  "curl",
  "pciutils",
  "usbutils",
  "less",
  # vi (vim-minimal) and vim.
  "vim-minimal",
  "vim-enhanced",
  "which",
  # Archives and disk/system diagnostics.
  "tar",
  "gzip",
  "htop",
  "smartmontools",
  "hdparm",
  # Time sync.
  "chrony",
  "shadow-utils",
  "sudo",
  # SSH + service wiring expectations.
  "openssh-server",
  "openssh",
  "openssh-clients",
  # The Kerberos libraries sshd-session loads.
  "dbus",
  "dbus-common",
  "dbus-daemon",
  "dbus-broker",
  # Locale + console essentials.
  "glibc",
  "glibc-minimal-langpack",
  "kbd",
  # The console keymaps loadkeys loads.
  # Common runtime libs used by copied binaries.
  "pam",
  "audit",
  "procps-ng",
  # Shared libraries the packages above load. The lock resolves them as
  # dependencies, so naming them is redundant.
  # What the install docs configure: time zones under /usr/share/zoneinfo and
  # compiled locales. NetworkManager is the `network` group's (recipes/).
  "tzdata",
  "glibc-langpack-cs",
  "glibc-langpack-de",
  "glibc-langpack-en",
  "glibc-langpack-es",
  "glibc-langpack-fi",
  "glibc-langpack-fr",
  "glibc-langpack-it",
  "glibc-langpack-nb",
  "glibc-langpack-nl",
  "glibc-langpack-pt",
  "glibc-langpack-ru",
  "glibc-langpack-sr",
  "glibc-langpack-sv",
  # WiFi regulatory data and iw; NetworkManager's WiFi over wpa_supplicant is
  # the `network` group's.
  "wireless-regdb",
  "iw",
  # Firmware the kernel's drivers load from /usr/lib/firmware (.xz, which the
  # kernel reads through FW_LOADER_COMPRESS_XZ): graphics, WiFi and Bluetooth,
  # laptop audio, and linux-firmware for the rest. No CPU microcode: nothing
  # puts it in front of the initramfs yet.
  "linux-firmware",
  "amd-gpu-firmware",
  "intel-gpu-firmware",
  "nvidia-gpu-firmware",
  "iwlwifi-dvm-firmware",
  "iwlwifi-mvm-firmware",
  "iwlwifi-mld-firmware",
  "iwlbluetooth-firmware",
  "realtek-firmware",
  "mt7xxx-firmware",
  "atheros-firmware",
  "brcmfmac-firmware",
  "alsa-sof-firmware",
  "intel-audio-firmware",
  "cirrus-audio-firmware",
  # pam_systemd.so: without it logind registers no session, whatever desktop
  # a group recipe installs.
  "systemd-pam",
]

# The default software set (docs/product-handoff.md 2.4): group recipes of
# the public catalogue (recipes/), installed through Recipe into every target
# during the installation. The release medium carries these recipes; the
# packages they pin come as downloadable parts (the categories below). The
# system image is the base above; nothing here is burned into it. `cargo xtask base lock levitate` locks what
# the group recipes' seeds need beyond the base (the desktop lock), which the
# preseed downloads; `cargo xtask base groups levitate` writes each recipe's
# share of it as its pins.
[desktop]
recipes = [
  "plasma", "login-screen", "konsole", "dolphin", "kwrite", "ark", "spectacle",
  "plasma-systemmonitor", "kcalc", "skanlite", "drkonqi", "print-manager", "firefox",
  "audio", "network", "network-ui", "bluetooth", "printing", "firewall", "fonts",
  "fonts-office", "fonts-cjk", "spelling", "screen-reader", "thumbnailers",
  "graphics-drivers", "filesystems", "thunderbolt", "manuals", "vm-guest", "rec-apps",
]
preseed_recipe_script = "distro/builder/os-recipes/fedora-rpm-desktop-preseed.rhai"
# What compiling the desktop apps (tools/gui/) needs: the C++ compiler, CMake with
# make, and Qt's development files; for the login screen (tools/reclogin) also
# Fedora's Rust toolchain and the development files of libpam, libinput and
# libxkbcommon, which it links. Locked with the desktop lock, so the Qt and the
# libraries they are compiled against are the ones desktop-libs and the base
# ship. Only the root they are compiled in has these; no image does. The
# compiled apps are a prebuilt tree (`prebuilt publish desktop-apps`), which the
# rec-apps recipe pins; reclogin is the prebuilt `login-screen`.
apps_build_packages = [
  "gcc-c++", "make", "cmake", "qt6-qtbase-devel", "qt6-qtsvg-devel",
  "rust", "cargo", "pam-devel", "libinput-devel", "libxkbcommon-devel",
]
apps_build_preseed_recipe_script = "distro/builder/os-recipes/fedora-rpm-apps-build-preseed.rhai"
apps_build_root_recipe_script = "distro/builder/os-recipes/fedora-rpm-apps-build-root.rhai"

# The default set cut into categories, one downloadable part each
# (docs/release-engineering.md, section 11; `parts-<name>.tar.zst`). Every recipe
# above is in exactly one category. A package file goes into the part of the
# first category (in this order) whose recipes and their deps need it, so the
# parts do not overlap; each part stays under 1.5 GiB.
[[desktop.categories]]
name = "desktop"
recipes = [
  "plasma", "login-screen", "konsole", "dolphin", "kwrite", "ark", "spectacle",
  "plasma-systemmonitor", "kcalc", "skanlite", "drkonqi", "print-manager",
  "thumbnailers", "manuals",
]
[[desktop.categories]]
name = "browser"
recipes = ["firefox"]
[[desktop.categories]]
name = "system"
recipes = [
  "audio", "network", "network-ui", "bluetooth", "printing", "firewall",
  "graphics-drivers", "filesystems", "thunderbolt", "vm-guest",
]
[[desktop.categories]]
name = "fonts"
recipes = ["fonts", "fonts-office", "fonts-cjk", "spelling", "screen-reader"]
[[desktop.categories]]
name = "apps"
recipes = ["rec-apps"]
