# LevitateOS variant contract. Its shape is `distro_contract::ConformanceContract`;
# `distro_contract::load` reads and validates it. Paths are relative to the repo
# root unless a comment says otherwise. The products and scenarios are
# `distro_contract::registry`, the same for every variant, and every artifact
# name (`<os_id>-x86_64-<product>.iso`, `<os_id>-live.efi`, ...) follows from
# `os_id`.
schema_version = 8

[identity]
os_name = "LevitateOS"
os_id = "levitateos"
os_version = "1.0"

# The base facts this variant differs in (`distro_profile::Profile`). The
# builder writes them into the image's /etc/os-release as REC_* fields, which
# the install tools read on the target. The ISO label (`os_id` in capitals),
# default hostname (`os_id`), login prompt (`<os_id> login:`) and kernel
# localversion (`-<variant id>`) follow from the identity, and the bun TUI binary
# is built for the libc. `kernel_line` picks the kernel: its exact version is
# pinned in distro/builder/recipes/kernel/metadata.rhai, its configuration is
# ../_shared/kconfig plus `kconfig` beside this file.
[profile]
packages = "rpm"
init = "systemd"
libc = "glibc"
privilege = "sudo"
desktop = "plasma"
kernel_line = "lts"

[sources.rootfs_source]
recipe_script = "distro/builder/recipes/fedora-rpm-source-rootfs.rhai"
preseed_recipe_script = "distro/builder/recipes/fedora-rpm-preseed.rhai"

# What the rootfs takes from Fedora 45; `cargo xtask base lock levitate` locks
# it with every dependency.
[sources.rootfs_source.base]
release = "45"
signing_key = "keys/RPM-GPG-KEY-fedora-45-primary"
# The image writes its own os-release; `setup` asks for a `system-release`
# package, which would pull fedora-release and its repo files.
provided_elsewhere = ["system-release"]
packages = [
  # Root filesystem skeleton and core runtime.
  "filesystem",
  "setup",
  "bash",
  "bash-completion",
  "coreutils",
  "coreutils-common",
  "findutils",
  "grep",
  "gawk",
  "ncurses-libs",
  "sed",
  "diffutils",
  # System boot/service runtime for live boot.
  "systemd",
  "systemd-libs",
  "systemd-udev",
  # Fedora 45 ships systemd-sysusers apart from systemd; without it the system
  # users and groups (systemd-journal, ...) are never made and boots end degraded.
  "systemd-sysusers",
  "iproute",
  "kmod",
  "util-linux",
  "util-linux-core",
  # Disks, filesystems and the boot loader.
  "e2fsprogs",
  "e2fsprogs-libs",
  "libss",
  "dosfstools",
  "systemd-boot-unsigned",
  "iputils",
  "curl",
