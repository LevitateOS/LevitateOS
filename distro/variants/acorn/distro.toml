# AcornOS variant contract. Its shape is `distro_contract::ConformanceContract`;
# `distro_contract::load` reads and validates it. Paths are relative to the repo
# root unless a comment says otherwise. The products and scenarios are
# `distro_contract::registry`, the same for every variant, and every artifact
# name (`<os_id>-x86_64-<product>.iso`, `<os_id>-live.efi`, ...) follows from
# `os_id`.
schema_version = 8

[identity]
os_name = "AcornOS"
os_id = "acornos"
os_version = "1.0"

# The base facts this variant differs in (`distro_profile::Profile`). The
# builder writes them into the image's /etc/os-release as REC_* fields, which
# the install tools read on the target. The ISO label (`os_id` in capitals),
# default hostname (`os_id`), login prompt (`<os_id> login:`) and kernel
# localversion (`-<variant id>`) follow from the identity, and every tool is
# built for the libc. `kernel_line` picks the kernel: its exact version is
# pinned in distro/builder/recipes/kernel/metadata.rhai, its configuration is
# ../_shared/kconfig plus `kconfig` beside this file.
[profile]
packages = "apk"
init = "openrc"
libc = "musl"
privilege = "doas"
desktop = "lxqt"
kernel_line = "latest"

[sources.rootfs_source]
storage_max_objects = 131072
inputs = { capabilities = "distro/contract/capabilities.txt" }
memory_mib = 4096
preseed_memory_mib = 4096
network_hosts = []
preseed_network_hosts = ["dl-cdn.alpinelinux.org:443"]
kind = "recipe_custom"
recipe_script = "distro/builder/recipes/alpine-live-source-rootfs.rhai"
preseed_recipe_script = "distro/builder/recipes/alpine-preseed-source-assets.rhai"
preseed_outputs = { apks = "directory" }

# What the rootfs takes from Alpine's v3.24 branch; `cargo xtask base lock
# acorn` locks it with every dependency. kbd-bkeymaps stays until recsetup
# lists kbd's keymaps on OpenRC.
[sources.rootfs_source.base]
release = "v3.24"
signing_key = "keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub"
packages = [
  "alpine-base",
  "busybox",
  "openrc",
  "doas",
  "bash",
  "bash-completion",
  "coreutils",
  "findutils",
  "grep",
  "sed",
  "gawk",
  "diffutils",
  "procps-ng",
  "tar",
  "gzip",
  "less",
  "vim",
  "kbd",
  "kbd-legacy",
  "kbd-bkeymaps",
  "musl-locales",
  "musl-locales-lang",
  "tzdata",
  "util-linux",
  "e2fsprogs",
  "dosfstools",
  "systemd-boot",
  "openssh",
  "openssh-server",
  "iproute2",
  "iputils",
  "curl",
  "dhcpcd",
  "networkmanager",
  "networkmanager-cli",
  "networkmanager-wifi",
  "wpa_supplicant",
  "iw",
  "pciutils",
  "usbutils",
  "smartmontools",
  "hdparm",
  "htop",
  "audit",
  "chrony",
  "dbus",
]

# The live ISO's install screen: this shell beside the install docs. getty
# starts it on each console listed; the serial console runs it only when the
# boot asks for it (the INSTALL_UX_SERIAL boot-injection key).
[install_ux]
consoles = ["tty1", "ttyS0"]
shell = "/bin/sh"
docs = { app = "install-docs", page = "installation" }
# TUI apps on the live ISO besides the docs, as commands for the shell beside them.
apps = ["disk-plan", "base-system"]
# The left pane: the install steps in order, with the shell one key away.
hub = "install-hub"

# What the live system adds to what every variant's has (the installed
# system's services, sshd, the shared kernel command line and the init
# system's). Every system's commands are distro/contract/capabilities.txt.
[live]
services = ["network"]

# Boots through the same busybox initramfs recinit builds for every variant.
[installed]
initramfs = true
