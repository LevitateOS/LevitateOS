# AcornOS variant contract. Its shape is `distro_contract::ConformanceContract`;
# `distro_contract::load` reads and validates it. Paths are relative to the repo
# root unless a comment says otherwise. The products and scenarios are
# `distro_contract::registry`, the same for every variant, and every artifact
# name (`<os_id>-x86_64-<product>.iso`, `<os_id>-live.efi`, ...) follows from
# `os_id`.
schema_version = 12

[identity]
os_name = "AcornOS"
os_id = "acornos"
os_version = "1.0"
# The release serial: raise it by one, by hand, for every release (installed
# systems compare serials, never os_version), and point release_notes at that
# release's notes. docs/release-engineering.md, section 2.
release_serial = 1
release_notes = "https://levitateos.org/releases/acornos/1.0"

# The base facts this variant differs in (`distro_profile::Profile`). The
# builder writes them into the image's /etc/os-release as REC_* fields, which
# the install tools read on the target. The ISO label (`os_id` in capitals),
# default hostname (`os_id`), login prompt (`<os_id> login:`) and kernel
# localversion (`-<variant id>`) follow from the identity, and the bun TUI binary
# is built for the libc. `appearance` is the mode the distro starts in.
# `kernel_line` picks the kernel: its exact version is pinned in
# distro/builder/os-recipes/kernel/metadata.rhai, its configuration is
# ../_shared/kconfig plus `kconfig` beside this file.
[profile]
packages = "apk"
init = "openrc"
libc = "musl"
privilege = "doas"
desktop = "lxqt"
kernel_line = "lts"
appearance = "dark"

# The mode the distro starts in is `profile.appearance`; these are its colours in
# each mode. The terminal apps, the desktop look and the website all take them
# from here.
[look.light]
surface = "#E6DFCF"
surface_raised = "#EFE9DB"
surface_sunken = "#D9D1BE"
text = "#241A12"
text_secondary = "#54483C"
text_muted = "#6B5D4F"
rule = "#C2B8A2"
hairline = "#D0C7B3"
accent = "#644532"
highlight = "#214438"
band = "#644532"
on_band = "#F2EEE4"
ok = "#2F6B3F"
warn = "#7F5200"
bad = "#B22F27"

[look.dark]
surface = "#1F1711"
surface_raised = "#2B2019"
surface_sunken = "#150F0A"
text = "#F2EEE4"
text_secondary = "#CDBFAE"
text_muted = "#A89886"
rule = "#4D3D30"
hairline = "#382B21"
accent = "#E4CBA6"
highlight = "#C7D9BA"
band = "#644532"
on_band = "#F2EEE4"
ok = "#A9CF9A"
warn = "#F0B866"
bad = "#F0A497"

[sources.rootfs_source]
recipe_script = "distro/builder/os-recipes/alpine-live-source-rootfs.rhai"
preseed_recipe_script = "distro/builder/os-recipes/alpine-preseed-source-assets.rhai"

# What the rootfs takes from Alpine's v3.24 branch; `cargo xtask base lock
# acorn` locks it with every dependency.
[sources.rootfs_source.base]
release = "v3.24"
signing_key = "keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub"
packages = [
  "alpine-baselayout",
  "alpine-release",
  "eudev",
  "udev-init-scripts",
  "udev-init-scripts-openrc",
  "busybox-openrc",
  "busybox-suid",
  "musl-utils",
  "busybox",
  "openrc",
  "doas",
  # The login path: reclogin's /etc/pam.d/reclogin (tools/reclogin/dist/pam)
  # includes base-auth and its siblings, which linux-pam ships.
  "linux-pam",
  "bash",
  "bash-completion",
  "coreutils",
  "findutils",
  "grep",
  "sed",
  "gawk",
  "diffutils",
  "procps-ng",
  "tar",
  "gzip",
  "less",
  "kbd",
  "kbd-legacy",
  "musl-locales",
  "musl-locales-lang",
  "tzdata",
  "util-linux",
  "e2fsprogs",
  "dosfstools",
  "systemd-boot",
  "openssh",
  "openssh-server",
  "iproute2",
  "iputils",
  "curl",
  # NetworkManager and its WiFi over wpa_supplicant are the `network` group's
  # (recipes/).
  "iw",
  "wireless-regdb",
  "pciutils",
  "usbutils",
  "smartmontools",
  "hdparm",
  "htop",
  "audit",
  "chrony",
  "dbus",
  # Firmware the kernel's drivers load from /lib/firmware (.zst, which the
  # kernel reads through FW_LOADER_COMPRESS_ZSTD): graphics, WiFi and
  # Bluetooth, laptop audio. Alpine's split packages, not the linux-firmware
  # meta package; NVIDIA's firmware too, as on LevitateOS. No CPU
  # microcode: nothing puts it in front of the initramfs yet.
  "linux-firmware-amdgpu",
  "linux-firmware-radeon",
  "linux-firmware-i915",
  "linux-firmware-xe",
  "linux-firmware-intel",
  "linux-firmware-rtw88",
  "linux-firmware-rtw89",
  "linux-firmware-rtlwifi",
  "linux-firmware-rtl_nic",
  "linux-firmware-rtl_bt",
  "linux-firmware-mediatek",
  "linux-firmware-ath9k_htc",
  "linux-firmware-ath10k",
  "linux-firmware-ath11k",
  "linux-firmware-ath12k",
  "linux-firmware-ar3k",
  "linux-firmware-qca",
  "linux-firmware-brcm",
  "linux-firmware-cypress",
  "linux-firmware-cirrus",
  "linux-firmware-other",
  "linux-firmware-nvidia",
  "sof-firmware",
  # The seat and session manager and the policy daemon on OpenRC, which any
  # desktop a group recipe installs logs in through.
  "elogind",
  "polkit-elogind",
]

# The default software set (docs/product-handoff.md 2.4): group recipes of
# the public catalogue (recipes/), installed through Recipe into every target
# during the installation, from the release medium, which carries these
# recipes and every package they pin. The system image is the base above;
# nothing here is burned into it. `cargo xtask base lock acorn` locks what the
# group recipes' seeds need beyond the base (the desktop lock), which the
# preseed downloads; `cargo xtask base groups acorn` writes each recipe's share
# of it as its pins.
[desktop]
recipes = [
  "lxqt", "login-screen", "qterminal", "pcmanfm-qt", "lxqt-archiver", "lximage-qt",
  "screengrab", "pavucontrol-qt", "qalculate-qt", "mousepad", "qps", "simple-scan",
  "firefox", "xlibre", "audio", "network", "network-ui", "bluetooth", "printing",
  "firewall", "fonts", "fonts-office", "fonts-cjk", "spelling", "screen-reader",
  "thumbnailers", "graphics-drivers", "filesystems", "thunderbolt", "firmware-updates",
  "manuals", "vm-guest", "rec-apps",
]
preseed_recipe_script = "distro/builder/os-recipes/alpine-desktop-preseed.rhai"
# AcornOS runs XLibre, the fork of the X.Org server (github.com/X11Libre), not
# Alpine's xorg-server. Alpine has no XLibre package, so this recipe builds the
# server and XLibre's libinput input driver from pinned source in the
# apps-build root below, and the builder publishes their tree as the prebuilt
# `display-server` (distro/builder/src/display_server.rs). The xlibre group
# recipe carries only the server's run-time packages so far; the server
# itself is not installed by any recipe yet. X.Org-built driver packages
# (xf86-video-*, xf86-input-*) cannot be added (XLibre loads only modules built
# for its own ABI), and keeping XLibre current is this project's job: the
# source pins in the recipe are bumped for every XLibre point release, each
# treated as a security release.
display_server_recipe_script = "distro/builder/os-recipes/xlibre.rhai"
# What compiling the desktop apps (tools/gui/), the display server and the login
# screen (tools/reclogin) needs: the C++ compiler with the C library's headers,
# CMake with make, Qt's development files; for XLibre also meson with samurai,
# git to fetch its pinned source, and the development files of the libraries it
# links; for reclogin Alpine's Rust toolchain and the development files of
# linux-pam, libinput and libxkbcommon. Locked with the desktop, so what they
# are compiled against is what the desktop ships. Only the root they are
# compiled in has these; no image does.
apps_build_packages = [
  "g++", "musl-dev", "make", "cmake", "qt6-qtbase-dev", "qt6-qtsvg-dev",
  "meson", "samurai", "git", "xorgproto", "xtrans", "pixman-dev", "libxfont2-dev",
  "libxkbfile-dev", "libxcvt-dev", "libepoxy-dev", "mesa-dev", "libdrm-dev",
  "libpciaccess-dev", "libxshmfence-dev", "nettle-dev", "eudev-dev", "libx11-dev",
  "libxau-dev", "libxdmcp-dev", "libinput-dev",
  "rust", "cargo", "linux-pam-dev", "libxkbcommon-dev",
]
apps_build_preseed_recipe_script = "distro/builder/os-recipes/alpine-apps-build-preseed.rhai"
apps_build_root_recipe_script = "distro/builder/os-recipes/alpine-apps-build-root.rhai"
