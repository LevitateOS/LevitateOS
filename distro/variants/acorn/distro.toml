# AcornOS variant contract. Its shape is `distro_contract::ConformanceContract`;
# `distro_contract::load` reads and validates it. Paths are relative to the repo
# root unless a comment says otherwise. The products and scenarios are
# `distro_contract::registry`, the same for every variant, and every artifact
# name (`<os_id>-x86_64-<product>.iso`, `<os_id>-live.efi`, ...) follows from
# `os_id`.
schema_version = 8

[identity]
os_name = "AcornOS"
os_id = "acornos"
os_version = "1.0"

# The base facts this variant differs in (`distro_profile::Profile`). The
# builder writes them into the image's /etc/os-release as REC_* fields, which
# the install tools read on the target. The ISO label (`os_id` in capitals),
# default hostname (`os_id`), login prompt (`<os_id> login:`) and kernel
# localversion (`-<variant id>`) follow from the identity, and the bun TUI binary
# is built for the libc. `kernel_line` picks the kernel: its exact version is
# pinned in distro/builder/recipes/kernel/metadata.rhai, its configuration is
# ../_shared/kconfig plus `kconfig` beside this file.
[profile]
packages = "apk"
init = "openrc"
libc = "musl"
privilege = "doas"
desktop = "lxqt"
kernel_line = "lts"

[sources.rootfs_source]
recipe_script = "distro/builder/recipes/alpine-live-source-rootfs.rhai"
preseed_recipe_script = "distro/builder/recipes/alpine-preseed-source-assets.rhai"

# What the rootfs takes from Alpine's v3.24 branch; `cargo xtask base lock
# acorn` locks it with every dependency.
[sources.rootfs_source.base]
release = "v3.24"
signing_key = "keys/alpine-devel@lists.alpinelinux.org-6165ee59.rsa.pub"
packages = [
  "alpine-baselayout",
  "alpine-release",
  "eudev",
  "udev-init-scripts",
  "udev-init-scripts-openrc",
  "busybox-openrc",
  "busybox-suid",
  "musl-utils",
  "busybox",
  "openrc",
  "doas",
  "bash",
  "bash-completion",
  "coreutils",
  "findutils",
  "grep",
  "sed",
  "gawk",
  "diffutils",
  "procps-ng",
  "tar",
  "gzip",
  "less",
  "kbd",
  "kbd-legacy",
  "musl-locales",
  "musl-locales-lang",
  "tzdata",
  "util-linux",
  "e2fsprogs",
  "dosfstools",
  "systemd-boot",
  "openssh",
  "openssh-server",
  "iproute2",
  "iputils",
  "curl",
  "networkmanager",
  "networkmanager-cli",
  "networkmanager-wifi",
  "wpa_supplicant",
  "iw",
  "wireless-regdb",
  "pciutils",
  "usbutils",
  "smartmontools",
  "hdparm",
  "htop",
  "audit",
  "chrony",
  "dbus",
  # Firmware the kernel's drivers load from /lib/firmware (.zst, which the
  # kernel reads through FW_LOADER_COMPRESS_ZSTD): graphics, WiFi and
  # Bluetooth, laptop audio. Alpine's split packages, not the linux-firmware
  # meta package; NVIDIA's firmware too, as on LevitateOS. No CPU
  # microcode: nothing puts it in front of the initramfs yet.
  "linux-firmware-amdgpu",
  "linux-firmware-radeon",
  "linux-firmware-i915",
  "linux-firmware-xe",
  "linux-firmware-intel",
  "linux-firmware-rtw88",
  "linux-firmware-rtw89",
  "linux-firmware-rtlwifi",
  "linux-firmware-rtl_nic",
  "linux-firmware-rtl_bt",
  "linux-firmware-mediatek",
  "linux-firmware-ath9k_htc",
  "linux-firmware-ath10k",
  "linux-firmware-ath11k",
  "linux-firmware-ath12k",
  "linux-firmware-ar3k",
  "linux-firmware-qca",
  "linux-firmware-brcm",
  "linux-firmware-cypress",
  "linux-firmware-cirrus",
  "linux-firmware-other",
  "linux-firmware-nvidia",
  "sof-firmware",
]

# The desktop system, the rootfs of the live-desktop product (docs/desktop.md):
# the base packages plus these, LXQt on X11 with SDDM (decision D16: Alpine 3.24
# has no lxqt-wayland-session). `cargo xtask base lock acorn` locks what they
# need beyond the base lock; the preseed downloads that desktop lock.
[desktop]
display_manager = "sddm"
preseed_recipe_script = "distro/builder/recipes/alpine-desktop-preseed.rhai"
packages = [
  "lxqt-desktop", "lximage-qt", "pavucontrol-qt", "screengrab", "sddm", "xorg-server",
  "xf86-input-libinput", "eudev", "udev-init-scripts", "udev-init-scripts-openrc",
  "mesa-dri-gallium", "elogind", "polkit-elogind", "dbus", "dbus-x11", "pipewire",
  "wireplumber", "pipewire-pulse", "pipewire-alsa", "networkmanager", "networkmanager-wifi",
  "network-manager-applet", "breeze-icons", "font-noto", "firefox",
  # Mounting removable drives, trash, phones and cameras (gvfs), the keyboard
  # layout settings, monitor settings, portals for Firefox's file dialogs, and
  # notify-send.
  "udisks2", "gvfs", "gvfs-mtp", "gvfs-gphoto2", "setxkbmap", "xrandr", "xdg-desktop-portal",
  "xdg-desktop-portal-lxqt", "libnotify",
  # Video decoding, Vulkan, firmware updates, exFAT and NTFS drives, OpenVPN.
  "mesa-va-gallium", "intel-media-driver", "vulkan-loader", "mesa-vulkan-intel", "mesa-vulkan-ati",
  "fwupd", "exfatprogs", "ntfs-3g", "networkmanager-openvpn",
  # Metric-compatible fonts for documents, file thumbnails, spelling, manual
  # pages.
  "font-liberation", "ffmpegthumbnailer", "hunspell-en", "mandoc", "man-pages",
  # The same desktop LevitateOS has, on AcornOS's own stack: Bluetooth,
  # printing (CUPS, driverless printers found through Avahi), scanning,
  # Thunderbolt, the screen reader with its speech, an on-screen keyboard,
  # CJK fonts, the guest agents of the libvirt test VMs, the firewall and its
  # settings, a compositor (KWin composites on LevitateOS), a calculator, a
  # text editor, a task manager and the archive tools lxqt-archiver uses.
  "bluez", "blueman", "cups", "cups-filters", "avahi", "system-config-printer", "sane-backends",
  "simple-scan", "bolt", "orca", "speech-dispatcher", "espeak-ng", "onboard", "font-noto-cjk",
  "spice-vdagent", "qemu-guest-agent", "firewalld", "firewalld-gui", "picom", "qalculate-qt",
  "mousepad", "qps", "unzip", "7zip",
]
