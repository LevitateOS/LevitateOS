schema_version = 6

[build_host]
required_build_tools = [
  # Commands the kernel/rootfs build and the release hook run on the host.
  # Workspace tools (recinit, reciso, recuki, install tools) and Recipe are
  # built from this checkout and are not host requirements.
  "cargo",
  "make",
  "curl",
  "mkfs.erofs",
  "xorriso",
  "mkfs.fat",
  "mmd",
  "mcopy",
  "sha512sum",
  "ukify",
]
kernel_kconfig_path = "kernel/kconfig"
recipe_kernel_script = "distro/builder/recipes/linux-prebuilt.rhai"
recipe_kernel_invocation = "recipe install"
kernel_release_path = "kernel-build/include/config/kernel.release"
kernel_image_path = "staging/boot/vmlinuz"
kernel_modules_path = "staging/usr/lib/modules/<kernel.release>"
kernel_version = "7.3.3"
kernel_sha256 = "79c66dde66cd96877fcde8f7d36aec946b1f423d2b97b5a7b1751b75c764f3d1"
kernel_localversion = "-acorn"
module_install_path = "/usr/lib/modules"

[build_host.evidence]
script_path = "evidence/build-capability.sh"
pass_marker = "BUILD CAPABILITY PASSED"
