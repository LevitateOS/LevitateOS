name: Rust Release

on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        default: '.'
        type: string
      version-bump:
        description: 'Which part of the version to bump: major, minor or patch'
        required: false
        default: 'patch'
        type: string
      release-commit-prefix:
        description: >-
          Start of the version-bump commit's message. The job skips a push whose head
          commit is one, so callers need no guard of their own.
        required: false
        default: 'chore: Bump version to'
        type: string
      create-binary-artifact:
        description: 'Create tar.gz binary artifact (for binaries)'
        required: false
        default: false
        type: boolean
      create-rpm-artifact:
        description: 'Create RPM artifact with cargo-generate-rpm'
        required: false
        default: false
        type: boolean
      binary-name:
        description: 'Binary name for artifact (required if create-binary-artifact)'
        required: false
        default: ''
        type: string
      rpm-glob:
        description: 'Glob for generated RPM files relative to working-directory'
        required: false
        default: 'target/generate-rpm/*.rpm'
        type: string
      publish-to-crates-io:
        description: 'Publish to crates.io (for libraries only)'
        required: false
        default: false
        type: boolean
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: false

jobs:
  release:
    name: Release
    if: ${{ !startsWith(github.event.head_commit.message, inputs.release-commit-prefix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      # cargo metadata and cargo set-version read and write the version wherever the
      # manifest keeps it, an inherited `version.workspace = true` included.
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.version-bump }}
        run: |
          set -euo pipefail
          case "$BUMP" in
            major|minor|patch) ;;
            *) echo "version-bump must be major, minor or patch, not '$BUMP'" >&2; exit 1 ;;
          esac
          cargo set-version --bump "$BUMP"
          NEW_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg manifest "$PWD/Cargo.toml" '.packages[] | select(.manifest_path == $manifest) | .version')
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - run: cargo check

      - name: Commit version bump
        env:
          PREFIX: ${{ inputs.release-commit-prefix }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git add -u
          git commit -m "$PREFIX $VERSION [skip ci]"
          git push

      - name: Create and push tag
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Build release binary
        if: inputs.create-binary-artifact || inputs.create-rpm-artifact
        run: cargo build --release

      - name: Create artifact
        if: inputs.create-binary-artifact
        run: |
          tar -czvf ${{ inputs.binary-name }}-x86_64-linux.tar.gz \
            -C target/release ${{ inputs.binary-name }}

      - name: Install cargo-generate-rpm
        if: inputs.create-rpm-artifact
        run: cargo install cargo-generate-rpm

      - name: Build RPM artifact
        if: inputs.create-rpm-artifact
        run: cargo generate-rpm

      - name: Collect release files
        id: release_files
        shell: bash
        run: |
          files=()
          if [[ "${{ inputs.create-binary-artifact }}" == "true" ]]; then
            files+=("${{ inputs.binary-name }}-x86_64-linux.tar.gz")
          fi
          if [[ "${{ inputs.create-rpm-artifact }}" == "true" ]]; then
            shopt -s nullglob
            rpm_matches=( ${{ inputs.rpm-glob }} )
            shopt -u nullglob
            if [[ ${#rpm_matches[@]} -eq 0 ]]; then
              echo "No RPM artifacts matched '${{ inputs.rpm-glob }}'" >&2
              exit 1
            fi
            files+=("${rpm_matches[@]}")
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.release_files.outputs.files }}

      - name: Publish to crates.io
        if: inputs.publish-to-crates-io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
