name: Bun CI

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory'
        required: false
        default: '.'
        type: string
      scripts:
        description: >-
          Space-separated package.json scripts to run, in order, after the install.
          The caller's package.json must define each one.
        required: false
        default: 'typecheck'
        type: string
      run-build:
        description: 'Run bun run build'
        required: false
        default: false
        type: boolean
      upload-dist:
        description: 'Upload dist/ as artifact'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      # The bun version is package.json's `packageManager`, as for a local install.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ inputs.working-directory }}/package.json

      # Exactly the dependencies bun.lock records, as `cargo xtask check` installs them.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run scripts
        env:
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          set -eu
          for script in $SCRIPTS; do
            bun run "$script"
          done

      - name: Build
        if: inputs.run-build
        run: bun run build

      - name: Upload build artifact
        if: inputs.upload-dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ inputs.working-directory }}/dist/
          retention-days: 7
