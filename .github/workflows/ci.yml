name: CI

# Every job is a `cargo xtask` call, the same front door as a local run: CI states
# no repo facts of its own (crate lists, release paths, host packages, scenario lists).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      type: any

  # The quick checks: exactly what `cargo xtask check` and `cargo xtask check tui` run locally.
  check:
    name: cargo xtask check
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The guest-script check parses every script in AcornOS's shell too.
      - name: Install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox

      - run: cargo xtask check

      - run: cargo xtask check tui

  # Each distro's products, built once, then every scenario against them.
  products:
    name: Products and scenarios (${{ matrix.distro }})
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro: [levitate, acorn]
    env:
      DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install host tools
        run: |
          sudo apt-get update
          # shellcheck disable=SC2046 # one word per package
          sudo apt-get install -y $(cargo xtask doctor --packages apt)

      - name: Prepare the pinned Recipe bootstrap root
        shell: bash
        run: |
          set -euo pipefail
          export GINUX_OCI_CACHE_DIR_OVERRIDE="$RUNNER_TEMP/recipe-oci"
          export GINUX_OCI_WORK_DIR_OVERRIDE="$RUNNER_TEMP/recipe-oci-work"
          (
            cd tools/ginux
            ./scripts/fetch-rocky-oci.sh
            ./scripts/prepare-rocky-oci.sh
          )
          base=$(jq -er '.base.path' tools/recipe/bootstrap/ginux-build-image.json)
          digest=$(jq -er '.base.sha256' tools/recipe/bootstrap/ginux-build-image.json)
          rootfs="$GINUX_OCI_CACHE_DIR_OVERRIDE/${base#oci-cache/}"
          printf '%s  %s\n' "$digest" "$rootfs" | sha256sum --check --strict
          echo "GINUX_ROOTFS=$rootfs" >> "$GITHUB_ENV"
          echo "GINUX_ROOT=oci:recipe-bootstrap@sha256:$digest" >> "$GITHUB_ENV"

      - name: Acquire the kernel and the rootfs source
        run: |
          sudo -n env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" GINUX_ROOT="$GINUX_ROOT" GINUX_ROOTFS="$GINUX_ROOTFS" cargo xtask build kernel "$DISTRO" --prebuilt
          sudo -n env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" GINUX_ROOT="$GINUX_ROOT" GINUX_ROOTFS="$GINUX_ROOTFS" cargo xtask build rootfs-source "$DISTRO"

      - name: Build every release product
        run: |
          set -euo pipefail
          for product in $(cargo xtask status "$DISTRO" --json | jq -r '.artifacts | keys_unsorted[]'); do
            sudo -n env PATH="$PATH" CARGO_HOME="$CARGO_HOME" RUSTUP_HOME="$HOME/.rustup" GINUX_ROOT="$GINUX_ROOT" GINUX_ROOTFS="$GINUX_ROOTFS" cargo xtask build "$product" "$DISTRO"
          done

      - name: Run every scenario
        timeout-minutes: 90
        run: cargo xtask test all "$DISTRO" --force

      - name: Locate the live-tools ISO
        run: echo "LIVE_TOOLS_ISO=$(cargo xtask status "$DISTRO" --json | jq -r '.artifacts["live-tools"]')" >> "$GITHUB_ENV"

      - name: Upload the live-tools ISO
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.distro }}-live-tools-iso
          path: ${{ env.LIVE_TOOLS_ISO }}
          if-no-files-found: error
          retention-days: 7
