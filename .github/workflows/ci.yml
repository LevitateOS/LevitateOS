name: CI

# Every job is a `cargo xtask` call, the same front door as a local run: CI states
# no repo facts of its own (crate lists, release paths, host packages, scenario lists).
# CI runs only the quick checks. Products (rootfs, ISOs) and VM scenarios are built
# locally, when the user asks, never in CI.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always

# A newer push supersedes a run still going: only the latest commit's result matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      type: any

  # The quick checks: exactly what `cargo xtask check` and `cargo xtask check tui` run locally.
  check:
    name: cargo xtask check
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # The guest-script check parses every script in AcornOS's shell too.
      - name: Ensure busybox is available
        run: |
          if ! command -v busybox >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y busybox
          fi

      - run: cargo xtask check

      - run: cargo xtask check tui
