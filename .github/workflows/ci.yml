name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  # Build rec* tools in release mode for ISO
  REC_BUILD_RELEASE: "1"

jobs:
  # ===========================================================================
  # Stage 0: Detect changes (skip expensive jobs for docs-only commits)
  # ===========================================================================
  changes:
    uses: ./.github/workflows/detect-changes.yml
    with:
      type: rust

  # Build explicit products once; all runtime checks consume those artifacts.
  product-integration:
    name: Products and Integration Tests
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RECIPE_BINARY: ${{ github.workspace }}/target/release/recipe
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils xorriso mtools dosfstools cpio zstd \
            qemu-system-x86 qemu-utils ovmf systemd-container systemd-ukify
          bun install --ignore-scripts

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Build xtask and the rootfs checker
        run: cargo build --release -p levitate-recipe -p levitate-xtask -p rootfs-tests

      - name: Acquire declared kernel and rootfs inputs
        run: |
          target/release/levitate-xtask build kernel levitate --prebuilt
          target/release/levitate-xtask build rootfs-source levitate

      - name: Build live products explicitly
        run: |
          target/release/levitate-xtask build live-boot levitate
          target/release/levitate-xtask build live-tools levitate

      - name: Verify serial, SSH, installation and runtime behavior
        timeout-minutes: 30
        run: |
          set -euo pipefail
          target/release/levitate-xtask run live-boot levitate --no-shell
          target/release/levitate-xtask run live-boot levitate --ssh --no-shell
          # `all` is live-boot, live-tools, install, installed-boot, automated-login, runtime.
          target/release/levitate-xtask test all levitate --force

      - name: Verify the composed product rootfs
        timeout-minutes: 15
        run: |
          set -euo pipefail
          rootfs_images=(.artifacts/out/levitate/releases/live-tools/run-*/filesystem.erofs)
          overlay_images=(.artifacts/out/levitate/releases/live-tools/run-*/overlayfs.erofs)
          if [ "${#rootfs_images[@]}" -ne 1 ] || [ ! -f "${rootfs_images[0]}" ] || \
             [ "${#overlay_images[@]}" -ne 1 ] || [ ! -f "${overlay_images[0]}" ]; then
            echo 'Expected one live-tools release with rootfs and overlay EROFS images.' >&2
            exit 1
          fi
          inspection="$(mktemp -d "$RUNNER_TEMP/rootfs-check.XXXXXX")"
          mkdir -p "$inspection"/{rootfs,overlay,upper,work,merged}
          cleanup() {
            for mountpoint in merged overlay rootfs; do
              if mountpoint -q "$inspection/$mountpoint"; then
                sudo umount "$inspection/$mountpoint"
              fi
            done
            sudo rm -rf -- "$inspection"
          }
          trap cleanup EXIT
          sudo mount -t erofs -o loop,ro "${rootfs_images[0]}" "$inspection/rootfs"
          sudo mount -t erofs -o loop,ro "${overlay_images[0]}" "$inspection/overlay"
          sudo mount -t overlay overlay \
            -o "lowerdir=$inspection/overlay:$inspection/rootfs,upperdir=$inspection/upper,workdir=$inspection/work" \
            "$inspection/merged"
          target/release/rootfs-tests run --rootfs "$inspection/merged"

      - name: Upload live-tools ISO
        uses: actions/upload-artifact@v4
        with:
          name: levitateos-live-tools-iso
          path: .artifacts/out/levitate/releases/live-tools/run-*/*.iso
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Lint and check all crates
  # ===========================================================================
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Clippy - recipe
        working-directory: tools/recipe
        run: cargo clippy -- -D warnings

      - name: Clippy - install-tests
        working-directory: testing/install-tests
        run: cargo clippy -- -D warnings

      - name: Clippy - rootfs-tests
        working-directory: testing/rootfs-tests
        run: cargo clippy -- -D warnings

      - name: Clippy - hardware-compat
        working-directory: testing/hardware-compat
        run: cargo clippy -- -D warnings

      - name: Clippy - recstrap
        working-directory: tools/recstrap
        run: cargo clippy -- -D warnings

