[workspace]
resolver = "2"
members = [
    "distro/contract",
    "distro/builder",
    "distro/builder/install-split-pane",
    "xtask",
    "tools/recipe",
    "tools/recinit",
    "tools/recstrap",
    "tools/recuki",
    "tools/reciso",
    "tools/recab",
    "tools/recpart",
    "tools/recqemu",
    "tools/recshuttle",
    "testing/fsdbg",
    "testing/install-tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["LevitateOS Contributors"]

[profile.release]
strip = true
lto = true
