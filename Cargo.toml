[workspace]
resolver = "2"
members = [
    "distro-spec",
    "distro-contract",
    "distro-builder",
    "distro-builder/install-split-pane",
    "leviso-elf",
    "xtask",
    "tools/recipe",
    "tools/recinit",
    "tools/recstrap",
    "tools/recfstab",
    "tools/recchroot",
    "tools/recuki",
    "tools/reciso",
    "tools/recab",
    "tools/recpart",
    "tools/recqemu",
    "tools/recshuttle",
    "testing/fsdbg",
    "testing/cheat-guard",
    "testing/cheat-test",
    "testing/install-tests",
    "testing/hardware-compat",
    "testing/rootfs-tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["LevitateOS Contributors"]

[profile.release]
strip = true
lto = true
