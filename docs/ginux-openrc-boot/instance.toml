schema_version = 1

[instance]
id = "acorn-openrc"
root = "docker.io/rockylinux/rockylinux@sha256:7a18ce2c9c1e0d8735f3e72685f9666150af25036e7f7b5ee4eede3754496f8c"
init = "/sbin/init"
args = []
environment = []

[resources]
vcpus = 2
memory_mib = 1024

[execution]
profile = "balanced"
backend = "ptrace-native"

[contract]
profile = "gate9-systemd-v1"

[storage]
assignments = ["root-overlay"]

[devices]
assignments = ["console", "null", "zero", "random"]

[network]
backend = "none"

[audit]
mode = "stderr"

[failure]
policy = "stop"
